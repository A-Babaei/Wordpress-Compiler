<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Academy-Tech Compiler — Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="widget.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; max-width: 960px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    p.hint { color: #62707d; font-size: 14px; }
    code { background: #f6f8fa; padding: 2px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Academy-Tech Compiler — local demo</h1>
  <p class="hint">
    This page loads the widget against a local API instance. Start the backend with
    <code>docker compose up --build</code> and set <code>ALLOW_ANONYMOUS=true</code> in your
    <code>.env</code> for this demo only (never in production — see SECURITY.md).
  </p>

  <div
    id="academy-tech-compiler"
    data-api-url="http://localhost:8000"
    data-token=""
    data-default-language="python"
  ></div>

  <script src="widget.js" defer></script>
</body>
</html>
